[package]
name = "metatext-editor"
version = "0.1.0"
description = "MetaText Editor Desktop App"
authors = ["MahorobaLab"]
edition = "2021"

[lib]
name = "metatext_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
gix = { version = "0.80", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
