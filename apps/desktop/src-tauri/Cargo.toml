[package]
name = "metatext-editor"
version = "0.1.0"
description = "MetaText Editor Desktop App"
authors = ["MahorobaLab"]
edition = "2021"

[lib]
name = "meta_csv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
